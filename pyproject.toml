[project]
name = "plate-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdulaziz James", email = "a.abdulaziz@uniconsoft.uz" }
]
requires-python = ">=3.12"
dependencies = [
    "fast-plate-ocr[onnx,train]>=1.1.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pycocotools>=2.0.11",
    "rfdetr[loggers,train]>=1.11.2",
    "timm>=1.0.31",
    "torchmetrics>=1.8.2",
    "transformers>=5.22.1",
]

[project.scripts]
plate-reader = "plate_reader:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
