# Bigger CCT (~cct-s size): wider convs, 4 transformer layers, 128-dim
model: cct
rescaling: {scale: 0.00392156862745098, offset: 0.0}
tokenizer:
  blocks:
    - {layer: Conv2D, filters: 48, kernel_size: 3, strides: 1}
    - {layer: Conv2D, filters: 48, kernel_size: 3, strides: 1}
    - {layer: MaxPooling2D, pool_size: 2}
    - {layer: Conv2D, filters: 96, kernel_size: 3, strides: 1}
    - {layer: MaxPooling2D, pool_size: 2}
    - {layer: Conv2D, filters: 128, kernel_size: 3, strides: 1}
    - {layer: MaxPooling2D, pool_size: 2}
  positional_emb: true
transformer_encoder:
  layers: 4
  heads: 4
  projection_dim: 128
  units: [128, 128]
